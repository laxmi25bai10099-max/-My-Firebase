<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gujarati Sign Learning</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

    <div class="login-container">

        <h1>Gujarati Sign Learning</h1>

        <p class="subtitle">
            Learn Gujarati through Sign Language
        </p>

        <p id="authError" class="auth-error hidden"></p>

        <!-- LOGIN VIEW -->
        <div id="loginView">

            <h2>Welcome Back!</h2>

            <form id="loginForm">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="signup-text">
                New user?
                <span id="showSignup">Create an account</span>
            </p>

        </div>

        <!-- SIGNUP VIEW -->
        <div id="signupView" class="hidden">

            <h2>Create Account</h2>

            <form id="signupForm">

                <label for="signupName">Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >

                <label for="signupEmail">Email</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="signupPassword">Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="signupConfirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="signupConfirmPassword"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <p class="signup-text">
                Already have an account?
                <span id="showLogin">Login</span>
            </p>

        </div>

    </div>

</div>

    <!-- Firebase SDKs (compat build — works with plain <script> tags) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
