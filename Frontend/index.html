<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gujarati Sign Learning</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <div class="login-container">

            <h1>Gujarati Sign Learning</h1>

            <p class="subtitle">
                Learn Gujarati through Sign Language
            </p>

            <p id="authError" class="auth-error hidden"></p>

            <!-- LOGIN VIEW -->
            <div id="loginView">

                <h2>Welcome Back!</h2>

                <form id="loginForm">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>


                <!-- GOOGLE LOGIN -->
                <div class="google-login-section">

                    <!-- Google Login Button -->
                    <button
                        type="button"
                        id="googleLogin"
                        class="google-login-button"
                    >

                        <!-- Google Logo -->
                        <svg
                            class="google-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                fill="#4285F4"
                                d="M21.35 12.23c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.5z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.54 13.59A5.86 5.86 0 0 1 6.23 12c0-.55.11-1.08.31-1.59V7.88H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.05 4.12l3.24-2.53z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.38c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.48 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53c.77-2.31 2.92-4.03 5.46-4.03z"
                            />

                        </svg>

                        <span>Login with Google</span>

                    </button>


                    <!-- OR DIVIDER -->
                    <div class="or-divider">
                        <span>OR</span>
                    </div>

                </div>


                <p class="signup-text">
                    New user?
                    <span id="showSignup">Create an account</span>
                </p>

            </div>


            <!-- SIGNUP VIEW -->
            <div id="signupView" class="hidden">

                <h2>Create Account</h2>

                <form id="signupForm">

                    <label for="signupName">Name</label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="signupEmail">Email</label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="signupPassword">Password</label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >

                    <button type="submit">
                        Sign Up
                    </button>

                </form>

                <p class="signup-text">
                    Already have an account?
                    <span id="showLogin">Login</span>
                </p>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FIREBASE SDKs
         ===================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>

</html>
